# Kontrole każdego PR i gałęzi main (docs/14-testy-i-jakosc.md, rozdz. 8).
# Lokalnie te same kontrole uruchamia check.bat. Akcje przypięte do SHA (docs/15, rozdz. 6.1).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, testy, serwer z bazą)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: game
          POSTGRES_PASSWORD: game
          POSTGRES_DB: game
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U game -d game"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain z rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Formatowanie
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Treść (content-compiler check)
        run: cargo run -q -p content-compiler --locked -- check
      - name: Testy
        run: cargo test --workspace --locked
      - name: Migracje na czystej bazie i testy integralności
        env:
          DATABASE_URL: postgres://game:game@127.0.0.1:5432/game
        run: |
          cargo run -q -p server --locked -- migrate
          cargo test -p server --tests --locked -- --ignored
      - name: SQLx CLI (wersja zgodna z biblioteką)
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features rustls,postgres
      - name: Metadane zapytań SQL są aktualne
        env:
          DATABASE_URL: postgres://game:game@127.0.0.1:5432/game
          SQLX_OFFLINE: 'false'
        run: cargo sqlx prepare --check --workspace -- --all-targets --locked
      - name: Balans postaci startowych (sim matrix, kryterium F3.5)
        run: cargo run -q -p sim --locked -- matrix --n 500
      - name: Hierarchia botów i profili AI, czas decyzji (kryteria F4)
        run: cargo run -q --release -p sim --locked -- ai --n 1200
      - name: Serwer z bazą (/healthz, /readyz)
        env:
          DATABASE_URL: postgres://game:game@127.0.0.1:5432/game
          LISTEN_ADDR: 127.0.0.1:8090
          LOG_FORMAT: text
        run: |
          cargo build -p server --locked
          ./target/debug/server &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8090/healthz && break
            sleep 1
          done
          echo
          curl -fsS http://127.0.0.1:8090/readyz
          echo

  wasm:
    name: Silnik do WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain z rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Budowanie engine-wasm
        run: cargo build -p engine-wasm --target wasm32-unknown-unknown --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # wasm-bindgen-test-runner musi mieć tę samą wersję co crate wasm-bindgen.
      - name: Wersja wasm-bindgen z Cargo.lock
        id: wasm-bindgen
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - name: Natywne = WASM (testy w Node)
        run: cargo test -p engine-wasm --target wasm32-unknown-unknown --locked

  web:
    name: Klient (Biome, tsc, Vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm exec biome ci
      - uses: ./.github/actions/browser-engine
      - name: Typy
        run: pnpm --recursive --if-present typecheck
      - name: Testy
        run: pnpm --filter web test
      - name: Budowanie
        run: pnpm --filter web build

  proto:
    name: Proto (buf)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec buf lint
      - name: Formatowanie
        run: pnpm exec buf format --diff --exit-code
      - name: Wygenerowane typy TypeScript są aktualne
        run: |
          pnpm proto:generate
          git diff --exit-code -- web/src/generated/proto

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Przeglądarka Chromium
        run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: Budowanie klienta
        uses: ./.github/actions/browser-engine
      - name: Pakiet klienta
        run: pnpm --filter web build
      - name: Testy e2e
        run: pnpm --filter e2e test
      - name: Lighthouse mobile (>=95)
        run: pnpm audit:web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            target/lighthouse/
          retention-days: 7
