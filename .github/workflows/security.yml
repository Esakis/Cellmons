name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with: { tool: 'cargo-deny@0.20.2' }
      - run: cargo deny --locked check advisories licenses sources
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version-file: .nvmrc }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
  zap:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      E2E_DATABASE_URL: postgres://game:game@127.0.0.1:5432/game
    services:
      postgres:
        image: postgres:18.6-alpine
        env: { POSTGRES_USER: game, POSTGRES_PASSWORD: game, POSTGRES_DB: game }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U game -d game" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version-file: .nvmrc }
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/browser-engine
      - run: pnpm --filter web build
      - run: cargo build -p server --example browser_fixture --locked
      - run: node e2e/security-scan.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: security-zap
          path: target/zap/
          retention-days: 14
