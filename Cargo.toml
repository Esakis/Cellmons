[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
engine = { path = "crates/engine" }
engine-ai = { path = "crates/engine-ai" }
engine-cards = { path = "crates/engine-cards" }
engine-content = { path = "crates/engine-content" }

anyhow = "1.0.104"
arrayvec = "0.7.8"
axum = "0.8.9"
# Wersja przenośna (bez SIMD i asemblera): ten sam kod natywnie i w WASM, prostsze budowanie.
blake3 = { version = "1.8.7", default-features = false, features = ["pure"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
dotenvy = "0.15.7"
fluent-syntax = "0.12.0"
http-body-util = "0.1.5"
proptest = "1.12.0"
rand_chacha = { version = "0.10.0", default-features = false }
serde = "1.0.229"
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false }
tokio = "1.53.3"
toml = "1.1.8"
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wasm-bindgen = "0.2.129"
wasm-bindgen-test = "0.3.79"

# Domyślne reguły to reguły silnika (06-silnik-gry.md, rozdz. 1 i 7): tylko liczby całkowite,
# deterministyczne kolekcje, brak czasu systemowego i losowości spoza jawnych strumieni.
# Zakazane typy i funkcje są w clippy.toml. Serwer i narzędzia luzują te zakazy we własnym Cargo.toml.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_arithmetic = "deny"

[profile.release]
lto = "fat"
codegen-units = 1

# Silnik w przeglądarce (06-silnik-gry.md, rozdz. 10): najmniejszy rozmiar WASM.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"
