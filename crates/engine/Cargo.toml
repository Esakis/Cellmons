[package]
name = "engine"
description = "Silnik reguł: czysty, deterministyczny, bez wejścia/wyjścia (docs/06-silnik-gry.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Narzędzia testowe (zasady klasyczne, konstruktor scenariuszy, losowe pojedynki) dla testów
# innych crate'ów i dla symulatora. Kod produkcyjny ich nie włącza.
testkit = []

[dependencies]
arrayvec.workspace = true
blake3.workspace = true
rand_chacha.workspace = true
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
toml.workspace = true

# Pomiar: `cargo bench -p engine` (docs/06-silnik-gry.md, rozdz. 10).
[[bench]]
name = "round"
harness = false

[lints]
workspace = true
