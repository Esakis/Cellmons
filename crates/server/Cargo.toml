[package]
name = "server"
description = "Serwer gry: HTTP, WebSocket, logika domenowa (docs/08-serwer.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
dotenvy.workspace = true
serde = { workspace = true, features = ["derive"] }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util.workspace = true
serde_json.workspace = true
tower = { workspace = true, features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Zakazy z clippy.toml dotyczą tylko silnika.
disallowed_types = "allow"
disallowed_methods = "allow"
