[package]
name = "server"
description = "Serwer gry: HTTP, WebSocket, logika domenowa (docs/08-serwer.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
arrayvec.workspace = true
argon2 = { version = "0.6.0", features = ["zeroize"] }
cookie = "0.18.2"
axum = { workspace = true, features = ["ws"] }
dotenvy.workspace = true
engine.workspace = true
engine-ai.workspace = true
engine-content.workspace = true
getrandom = "0.4.3"
futures-util = { version = "0.3.34", features = ["sink"] }
protocol = { path = "../protocol" }
hmac = "0.13.0"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11.1"
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time", "sync", "fs", "io-util"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
tower-http = { version = "0.7.1", features = ["cors"] }
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[dev-dependencies]
http-body-util.workspace = true
serde_json.workspace = true
tower = { workspace = true, features = ["util"] }
tokio-tungstenite = "0.30.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Zakazy z clippy.toml dotyczą tylko silnika.
disallowed_types = "allow"
disallowed_methods = "allow"
