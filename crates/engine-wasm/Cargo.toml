[package]
name = "engine-wasm"
description = "Silnik dla przeglądarki przez WebAssembly (docs/06-silnik-gry.md, rozdz. 13)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
engine.workspace = true
engine-ai.workspace = true
engine-cards.workspace = true
engine-content.workspace = true
wasm-bindgen.workspace = true
protocol = { path = "../protocol" }

[dev-dependencies]
engine = { workspace = true, features = ["testkit"] }

# Testy w WebAssembly uruchamia wasm-bindgen-test-runner w Node (.cargo/config.toml).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true

[lints]
workspace = true
