[package]
name = "sim"
description = "Symulator balansu (docs/11-ai-i-symulacje.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Na razie losowe pojedynki z narzędzi testowych silnika; boty dojdą w kroku F2.6.
engine = { workspace = true, features = ["testkit"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Zakazy z clippy.toml dotyczą tylko silnika.
disallowed_types = "allow"
disallowed_methods = "allow"
