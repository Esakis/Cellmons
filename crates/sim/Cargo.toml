[package]
name = "sim"
description = "Symulator balansu (docs/11-ai-i-symulacje.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Losowe postacie i talie z narzędzi testowych silnika; prawdziwa zawartość dojdzie w F3.
engine = { workspace = true, features = ["testkit"] }
engine-ai.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Zakazy z clippy.toml dotyczą tylko silnika.
disallowed_types = "allow"
disallowed_methods = "allow"
