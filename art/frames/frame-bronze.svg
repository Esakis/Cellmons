<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350" role="img" aria-label="Ramka karty: brązowa">
<title>Ramka karty: brązowa</title>
<defs>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e2a86a"/>
    <stop offset="0.45" stop-color="#b8773d"/>
    <stop offset="1" stop-color="#6f4420"/>
  </linearGradient>
</defs>
<!-- Ramka: zewnętrzny metal, wewnętrzny pergamin -->
<rect x="1" y="1" width="248" height="348" rx="16" fill="url(#metal)" stroke="#6f4420" stroke-width="2"/>
<rect x="9" y="9" width="232" height="332" rx="10" fill="#f8f3e8" stroke="#6f4420" stroke-width="1.5"/>
<!-- Pasek nazwy (miejsce na nazwę karty) -->
<rect x="58" y="16" width="176" height="30" rx="6" fill="#e2a86a" fill-opacity="0.45" stroke="#6f4420" stroke-width="1"/>
<!-- Koszt K (lewy górny róg) i koszt W (pod nim) -->
<circle cx="34" cy="31" r="17" fill="#2f4f8f" stroke="#6f4420" stroke-width="2"/>
<circle cx="34" cy="66" r="13" fill="#2e7d4f" stroke="#6f4420" stroke-width="2"/>
<!-- Okno ilustracji -->
<rect x="20" y="84" width="210" height="122" rx="6" fill="#e9e1cf" stroke="#6f4420" stroke-width="1.5"/>
<!-- Pasek wymagań szkół -->
<rect x="20" y="212" width="210" height="24" rx="5" fill="#e2a86a" fill-opacity="0.35" stroke="#6f4420" stroke-width="1"/>
<!-- Pole tekstu -->
<rect x="20" y="242" width="210" height="84" rx="6" fill="#fffdf8" stroke="#6f4420" stroke-width="1"/>
<!-- Klejnot rzadkości -->
<path d="M125 324l9 9-9 9-9-9z" fill="url(#metal)" stroke="#6f4420" stroke-width="1.5"/>
</svg>
