[global]
repo1-type=s3
repo1-path=/spellgambit/production
repo1-s3-bucket=REPLACE_OWNER_BUCKET
repo1-s3-endpoint=REPLACE_OWNER_EU_ENDPOINT
repo1-s3-region=REPLACE_OWNER_REGION
repo1-s3-key=REPLACE_OWNER_KEY
repo1-s3-key-secret=REPLACE_OWNER_SECRET
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=REPLACE_OFFLINE_BACKED_UP_RANDOM_PASSPHRASE
repo1-retention-full=30
repo1-retention-full-type=time
start-fast=y
process-max=2
log-level-console=warn
log-level-file=off

[game]
pg1-path=/var/lib/postgresql/18/docker
pg1-port=5432
