# Lokalne środowisko deweloperskie (docs/15-infrastruktura-i-wdrozenie.md, rozdz. 1).
# Start: run.bat albo docker compose -f deploy/docker-compose.dev.yml up -d --wait
name: game-dev

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      # Dane logowania tylko do lokalnej bazy deweloperskiej.
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game
      POSTGRES_DB: game
    ports:
      # Port 5433 na hoście, bo 5432 często zajmuje lokalnie zainstalowany PostgreSQL.
      # Tylko 127.0.0.1: baza nie jest widoczna w sieci lokalnej.
      - "127.0.0.1:5433:5432"
    volumes:
      # Od PostgreSQL 18 obraz trzyma dane w podkatalogu wersji, więc wolumin montujemy wyżej.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game -d game"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
