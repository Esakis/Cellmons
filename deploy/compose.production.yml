name: spellgambit
x-game: &game
  profiles: [slots]
  restart: unless-stopped
  init: true
  user: '65532:65532'
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
  env_file: [private/server.env]
  environment:
    LISTEN_ADDR: 0.0.0.0:8080
    OPS_LISTEN_ADDR: 0.0.0.0:9090
    TRUSTED_PROXY_IPS: 172.30.0.1,127.0.0.1
    LOG_FORMAT: json
  stop_grace_period: 30s
  logging: { driver: journald, options: { tag: '{{.Name}}' } }
services:
  migrate:
    image: ${CANDIDATE_IMAGE:?Use server image digest}
    profiles: [tools]
    env_file: [private/migrator.env]
    command: [migrate]
    user: '65532:65532'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  postgres:
    image: ${POSTGRES_IMAGE:?Use the verified pgBackRest image digest}
    restart: unless-stopped
    environment:
      POSTGRES_DB: game
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password]
    command: ['postgres', '-c', 'config_file=/etc/postgresql/production.conf']
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/production.conf:/etc/postgresql/production.conf:ro
      - ./private/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    shm_size: 512m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d game']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }
  game-blue:
    <<: *game
    image: ${BLUE_IMAGE:?Use server image digest}
    ports: ['127.0.0.1:18081:8080', '127.0.0.1:19091:9090']
  game-green:
    <<: *game
    image: ${GREEN_IMAGE:?Use server image digest}
    ports: ['127.0.0.1:18082:8080', '127.0.0.1:19092:9090']
    profiles: [candidate]
  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    env_file: [private/public.env]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./private/caddy:/etc/caddy/private:ro
      - /srv/spellgambit/web:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }
networks:
  default:
    ipam:
      config: [{ subnet: 172.30.0.0/24, gateway: 172.30.0.1 }]
volumes:
  pgdata:
  caddy-data:
  caddy-config:
secrets:
  postgres-password:
    file: ./private/postgres-password
