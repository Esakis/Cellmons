syntax = "proto3";
package game.v1;

message Empty {}
message Hello {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string build = 3;
  bytes content_version = 4;
  string locale = 5;
  string client_kind = 6;
  string native_version = 7;
}
message Resume {
  string resume_token = 1;
}
message PublicPlayer {
  string id = 1;
  string login = 2;
  string avatar_id = 3;
  uint32 template_id = 4;
  uint32 level = 5;
  sint32 rating = 6;
  uint32 rank = 7;
  string title = 8;
  string description = 9;
  string challenge_filter = 10;
  bool afk = 11;
  bool verified = 12;
  string clan_id = 13;
  string clan_name = 14;
  repeated sint32 stats = 15; // AF, OF, AM, OM, max HP, max stamina.
  repeated uint32 schools = 16;
  bool busy = 17;
  uint32 tier = 18;
  uint32 path_id = 19;
  string specialization = 20;
  uint32 gift_id = 21;
  bool mentor = 22;
}
message Welcome {
  PublicPlayer profile = 1;
  int64 server_time_ms = 2;
  bytes content_version = 3;
  string resume_token = 4;
  repeated string features = 5;
}
message SessionReplaced {}
message NetError {
  string code = 1;
}
message NetOk {}
message RoomJoin {
  string room = 1;
}
message RoomLeave {}
message RoomSnapshot {
  string room = 1;
  repeated PublicPlayer players = 2;
  repeated ChatMessage messages = 3;
  repeated string recent_duels = 4;
  string motd = 5; // Clan notice, sent only after membership authorization.
}
message RoomDelta {
  string room = 1;
  repeated PublicPlayer joined = 2;
  repeated string left = 3;
  repeated PublicPlayer updated = 4;
}
message ChatSend {
  string channel = 1;
  string to = 2;
  string text = 3;
}
message ChatMessage {
  string id = 1;
  string channel = 2;
  string room = 3;
  string from_id = 4;
  string from_login = 5;
  string to = 6;
  string text = 7;
  int64 at_ms = 8;
}
message SetChallengeFilter {
  string filter = 1;
}
message SetChatFilter {
  string filter = 1;
}
message SetAfk {
  bool afk = 1;
}
message PlayerTarget {
  string player = 1;
}
message PlayerInfo {
  PublicPlayer player = 1;
  bool online = 2;
}
message SocialEntry {
  string id = 1;
  string login = 2;
  bool online = 3;
}
message SocialSnapshot {
  repeated SocialEntry friends = 1;
  repeated SocialEntry ignores = 2;
}
message MailSend {
  string to = 1;
  string text = 2;
}
message MailList {
  string before_id = 1;
  uint32 limit = 2;
  bool sent = 3;
}
message MailTarget {
  string id = 1;
}
message MailEntry {
  string id = 1;
  string from_login = 2;
  string to_login = 3;
  string text = 4;
  int64 at_ms = 5;
  bool read = 6;
}
message MailSnapshot {
  repeated MailEntry messages = 1;
  string next_cursor = 2;
  bool sent = 3;
}
message ChallengeSend {
  string target = 1;
}
message ChallengeRespond {
  string challenge_id = 1;
  bool accept = 2;
}
message ChallengeCancel {
  string challenge_id = 1;
}
message TournamentReady {
  bool ready = 1;
}
message ChallengeReceived {
  string challenge_id = 1;
  PublicPlayer from = 2;
  PublicPlayer to = 3;
  int64 expires_at_ms = 4;
}
message ChallengeUpdate {
  string challenge_id = 1;
  string status = 2;
  string duel_id = 3;
}
