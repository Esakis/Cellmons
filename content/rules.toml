# Parametry zasad gry (docs/02-zasady-gry.md, rozdz. 13). Silnik czyta sekcje [duel] i [deck];
# sekcje rating, xp i training są wspólne dla wersjonowanej treści i serwera.
# Nieznany klucz w [duel] albo [deck] jest błędem, żeby literówka nie przeszła niezauważona.

[duel]
rounds = 5                              # R-RUN: najwyżej 5 rund
attacks_per_round = 3                   # R-RUN-04: sloty ataku i obrony (silnik obsługuje tylko 3)
focus_per_round = 4                     # R-RUN-01: przyrost K na początku rundy
# focus_cap = 12                        # R-RUN-02: limit K przy przyroście; brak klucza = bez limitu
change_cost = 1                         # R-RUN-05: K za każdy zmieniony slot
hand_size = 5                           # R-POJ-04: karty w ręce
combo_multipliers = [1, 2, 4]           # R-ATK-04: mnożniki 1., 2. i 3. trafienia serii
block_min_stamina = 1                   # R-ATK-02: W obrońcy potrzebna do bloku
default_settings = "highest_stat"       # R-POJ-06: ustawienia odniesienia w 1. rundzie
counter_resolution = "initiative_first" # R-CZA-05: rozstrzyganie przeciwzaklęć (faza F2)
move_timeout_after_opponent_s = 60      # R-RUN-08: czas na ruch po ruchu przeciwnika (serwer)
round_timeout_s = 90                    # R-RUN-08: limit całej fazy decyzji (serwer)
max_consecutive_timeouts = 3            # R-RUN-09: kolejne braki ruchu do walkowera (serwer)
reconnect_grace_s = 60                  # R-KON-05: czas na powrót po rozłączeniu (serwer)

[deck]
size = 20                               # R-TAL-01: karty w talii
max_copies = 4                          # R-TAL-02: kopie tej samej karty
fill_missing_with_random = true         # R-TAL-05: uzupełnianie talii losowymi kartami
saved_presets_max = 10                  # R-TAL-06: zapisane zestawy talii (serwer)

[rating]
k = 10

[xp]
base = 100
min = 10
max = 300
tier_mult_pct = [100, 110, 120, 130]
tier_add = [0, 0, 3, 6]
unverified_cap = 3000
cap = 65000

[training]
bot_rotation_min = 5

[unlock]
arena_chance_ppm = 5000
newbie_wins = [5, 15, 30]
rarity_weights = [70, 25, 5]

[economy]
initial = 40
arena_first_win = 10
arena_win = 2
arena_win_daily_cap = 10 # Ducats from normal wins, plus the separate first-win bonus; day = UTC.

[junkyard]
rarity_points = [5, 25, 100]
reward_threshold = 1000
fallback_ducats = 40

[progression]
level_xp = [0, 100, 220, 360, 520, 700, 900, 1120, 1360, 1620, 1900, 2200, 2520, 2860, 3220, 3620, 4080, 4620, 5260, 6000]
# Bronze thresholds; silver is x1.5 and gold x2. No additional XP gate at level 20.
reincarnation_xp = 6000
reincarnation_bonus_dp = [3, 6, 6]

[clan]
min_members = 5
max_members = 256
max_applications = 10

[tournament]
first_fight_s = 20
next_fight_s = 15
ready_grace_s = 90
registration_hours = 24
max_players = 256
max_teams = 64
max_fee = 1000000

[expedition]
avatar_chance_bps = 4000
card_chance_bps = 300
ducats_chance_bps = 100
avatar_pool = [1, 2, 3, 4, 5, 11, 13, 32]

[[expedition.difficulties]]
id = "walk"
stages = 4
bot = "apprentice"
boss_bot = "tactician"
level_min = -3
level_max = 0
boss_level = 1
rarity = "common"
fixed_ducats = 5
random_ducats = 10

[[expedition.difficulties]]
id = "expedition"
stages = 6
bot = "tactician"
boss_bot = "archmage"
level_min = -1
level_max = 2
boss_level = 2
rarity = "uncommon"
fixed_ducats = 10
random_ducats = 25

[[expedition.difficulties]]
id = "ordeal"
stages = 8
bot = "archmage"
boss_bot = "archmage"
level_min = 0
level_max = 3
boss_level = 3
rarity = "rare"
fixed_ducats = 20
