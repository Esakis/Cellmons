apply plugin: 'com.android.application'

def env = System.getenv()
def nativeVersion = env['ANDROID_VERSION'] ?: '1.0.0'
if (!(nativeVersion ==~ /[0-9]{1,3}\.[0-9]{1,2}\.[0-9]{1,2}/)) throw new GradleException('Invalid ANDROID_VERSION')
def parts = nativeVersion.tokenize('.').collect { it.toInteger() }
def nativeCode = parts[0] * 10000 + parts[1] * 100 + parts[2]
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
def application = env['ANDROID_APPLICATION_ID'] ?: 'dev.game.training'
if (!(application ==~ /[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){2,}/)) throw new GradleException('Invalid ANDROID_APPLICATION_ID')
def bundleUrl = env['WEB_BUNDLE_URL'] ?: ''
def bundleKey = env['WEB_BUNDLE_PUBLIC_KEY'] ?: ''
def apiOrigin = env['VITE_API_ORIGIN'] ?: ''
if (apiOrigin) {
    try {
        def parsed = new URI(apiOrigin)
        if (parsed.scheme != 'https' || !parsed.host || parsed.userInfo || parsed.query || parsed.fragment || parsed.path)
            throw new IllegalArgumentException()
    } catch (Exception ignored) { throw new GradleException('Invalid VITE_API_ORIGIN') }
}
def baseBundle = env['WEB_BUNDLE_VERSION'] ?: '0'
if (!(baseBundle ==~ /[0-9]{1,9}/)) throw new GradleException('Invalid WEB_BUNDLE_VERSION')
if (bundleUrl.isEmpty() != bundleKey.isEmpty()) throw new GradleException('Configure both bundle URL and public key')
if (bundleUrl && !(bundleUrl ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?\/[A-Za-z0-9_\/-]*\//)) throw new GradleException('Invalid WEB_BUNDLE_URL')
if (bundleKey && !(bundleKey ==~ /[A-Za-z0-9+\/]{43}=/)) throw new GradleException('Invalid Ed25519 public key')
def validateRelease = {
    if (application == 'dev.game.training' || !env['ANDROID_KEYSTORE'] || !env['ANDROID_STORE_PASSWORD'] || !env['ANDROID_KEY_ALIAS'] || !env['ANDROID_KEY_PASSWORD'] || !bundleUrl || !bundleKey)
        throw new GradleException('Release requires owner application ID, signing key and signed bundle configuration')
    if (baseBundle.toInteger() < 1 || nativeCode < 1) throw new GradleException('Release requires increasing native and web bundle versions')
    def metadata = file('src/main/assets/public/native-build.json')
    if (!metadata.isFile()) throw new GradleException('Run mobile sync with the release environment first')
    def built = new groovy.json.JsonSlurper().parse(metadata)
    def legalVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../../legal/documents.json')).version
    if (built.legalApproved != true || built.legalVersion != legalVersion)
        throw new GradleException('Public release requires reviewed legal documents and operator configuration; sync with PUBLIC_RELEASE=1 and LEGAL_CONFIG')
    if (!env['VITE_API_ORIGIN'] || !env['VITE_API_ORIGIN'].startsWith('https://') || built.apiOrigin != env['VITE_API_ORIGIN'] || built.version != nativeVersion || built.bundleVersion != baseBundle.toInteger())
        throw new GradleException('Android web assets do not match the release environment; run mobile sync again')
}
if (releaseRequested) validateRelease()
gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(':app:packageRelease') || graph.hasTask(':app:packageReleaseBundle')) validateRelease()
}

android {
    namespace = "dev.game.training"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId application
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode nativeCode
        versionName nativeVersion
        buildConfigField 'String', 'WEB_BUNDLE_URL', '"' + bundleUrl + '"'
        buildConfigField 'String', 'WEB_BUNDLE_KEY', '"' + bundleKey + '"'
        buildConfigField 'int', 'WEB_BUNDLE_BASE_VERSION', baseBundle
        buildConfigField 'String', 'API_ORIGIN', '"' + apiOrigin + '"'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (env['ANDROID_KEYSTORE']) {
            release {
                storeFile file(env['ANDROID_KEYSTORE'])
                storePassword env['ANDROID_STORE_PASSWORD']
                keyAlias env['ANDROID_KEY_ALIAS']
                keyPassword env['ANDROID_KEY_PASSWORD']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (env['ANDROID_KEYSTORE']) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures { buildConfig true }
    // An explicit, local fixture CA is trusted only by debug builds, never by release.
    def fixtureDir = file("$buildDir/generated/fixture")
    sourceSets.debug.res.srcDir(new File(fixtureDir, 'res'))
    sourceSets.debug.manifest.srcFile(new File(fixtureDir, 'AndroidManifest.xml'))
    fixtureDir.mkdirs()
    new File(fixtureDir, 'AndroidManifest.xml').text = '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:networkSecurityConfig="@xml/debug_network_security"/></manifest>'
    def xmlDir = new File(fixtureDir, 'res/xml'); xmlDir.mkdirs()
    def fixtureTrust = ''
    if (env['E2E_TLS_CERT']) {
        def rawDir = new File(fixtureDir, 'res/raw'); rawDir.mkdirs()
        new File(rawDir, 'fixture_ca.pem').bytes = file(env['E2E_TLS_CERT']).bytes
        fixtureTrust = '<certificates src="@raw/fixture_ca"/>'
    }
    new File(xmlDir, 'debug_network_security.xml').text = '<network-security-config><base-config cleartextTrafficPermitted="false"><trust-anchors><certificates src="system"/>' + fixtureTrust + '</trust-anchors></base-config></network-security-config>'
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Inventory resolved Maven components, including the Android build toolchain, without credentials.
tasks.register('dependencyInventory') {
    doLast {
        def modules = new TreeSet<String>()
        def collect = { configuration ->
            configuration.incoming.resolutionResult.allComponents.each { component ->
                def id = component.id
                if (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier)
                    modules.add("${id.group}:${id.module}:${id.version}".toString())
            }
        }
        collect(configurations.debugRuntimeClasspath)
        collect(configurations.releaseRuntimeClasspath)
        rootProject.allprojects.each { project ->
            def classpath = project.buildscript.configurations.findByName('classpath')
            if (classpath != null) collect(classpath)
        }
        def destination = rootProject.file('../../target/android-dependencies.json')
        destination.parentFile.mkdirs()
        destination.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(modules))
        def runtime = []
        configurations.releaseRuntimeClasspath.incoming.artifactView {
            componentFilter { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
        }.artifacts.artifacts.each { artifact ->
            def id = artifact.id.componentIdentifier
            def contents = new TreeSet<String>()
            def scan
            scan = { input ->
                def zip = new java.util.zip.ZipInputStream(input)
                try {
                    java.util.zip.ZipEntry entry
                    while ((entry = zip.nextEntry) != null) {
                        def name = entry.name.toLowerCase(java.util.Locale.ROOT)
                        def base = name.tokenize('/').last()
                        if (!entry.directory && !name.endsWith('.class') &&
                            base ==~ /(?:license|licence|notice|copying|copyright)(?:[._-].*)?/) {
                            def bytes = zip.readNBytes(524289)
                            if (bytes.length > 524288) throw new GradleException('Oversized license')
                            contents.add(new String(bytes, java.nio.charset.StandardCharsets.UTF_8))
                        } else if (name == 'classes.jar') {
                            scan(new ByteArrayInputStream(zip.readAllBytes()))
                        }
                    }
                } finally { zip.close() }
            }
            artifact.file.withInputStream { scan(it) }
            runtime.add([name: "${id.group}:${id.module}:${id.version}".toString(), content: contents.toList()])
        }
        runtime.sort { it.name }
        rootProject.file('../../target/android-runtime-licenses.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(runtime))
        logger.lifecycle("Inventoried ${modules.size()} Maven components")
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
