// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    configurations.classpath {
        resolutionStrategy.eachDependency { details ->
            // AGP's transitive tools use older versions; keep compatible patched release lines.
            if (details.requested.group == 'io.netty' && details.requested.name.startsWith('netty-') && !details.requested.name.startsWith('netty-tcnative')) details.useVersion '4.1.139.Final'
            if (details.requested.group == 'org.bouncycastle') details.useVersion '1.86'
            def patched = ['org.apache.commons:commons-compress':'1.28.0', 'org.bitbucket.b_c:jose4j':'0.9.7', 'org.jdom:jdom2':'2.0.6.1']
            def version = patched["${details.requested.group}:${details.requested.name}".toString()]
            if (version) details.useVersion version
        }
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    buildscript.configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.android.tools.build' && details.requested.name == 'gradle') details.useVersion '8.13.2'
            if (details.requested.group == 'io.netty' && details.requested.name.startsWith('netty-') && !details.requested.name.startsWith('netty-tcnative')) details.useVersion '4.1.139.Final'
            if (details.requested.group == 'org.bouncycastle') details.useVersion '1.86'
            def patched = ['org.apache.commons:commons-compress':'1.28.0', 'org.bitbucket.b_c:jose4j':'0.9.7', 'org.jdom:jdom2':'2.0.6.1']
            def version = patched["${details.requested.group}:${details.requested.name}".toString()]
            if (version) details.useVersion version
        }
    }
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
